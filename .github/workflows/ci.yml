# Lint and test on every push and pull request. OpenRocket isn't installed on CI runners,
# so tests marked `openrocket` are skipped here; run `.\tasks.ps1 check` locally for those.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,openrocket,mcp]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -m "not openrocket"
