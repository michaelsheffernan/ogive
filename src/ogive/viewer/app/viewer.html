<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ogive viewer</title>
<style>
  :root {
    --bg: #f4f1e8; --panel: rgba(244, 241, 232, 0.92); --ink: #14181f; --muted: #5b6472;
    --line: #d6d1c2; --amber: #b26a00; --cg: #1f5fbf; --cp: #c0392b; --accent: #f5b041;
    --changed: #7c4dce; --pass: #2e7d32; --ground: #e6e1d2;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #14181f; --panel: rgba(20, 24, 31, 0.9); --ink: #f2efe6; --muted: #a7aebb;
    --line: #2c3340; --amber: #f5b041; --cg: #6aa3ff; --cp: #ff7a6b;
    --changed: #b393f0; --pass: #6fcf75; --ground: #1a1f27;
    color-scheme: dark;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 13px/1.4 var(--font-sans, "Segoe UI", system-ui, sans-serif); }
  #app { position: relative; height: 560px; overflow: hidden; }
  canvas { display: block; }
  .panel { position: absolute; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; }
  #info { left: 10px; top: 10px; max-width: 58%; }
  #info h1 { font-size: 15px; margin: 0 0 2px; }
  #info .stats { color: var(--muted); }
  #controls { right: 10px; top: 10px; display: flex; flex-direction: column; gap: 4px; }
  #controls label { display: flex; gap: 6px; align-items: center; cursor: pointer; white-space: nowrap; }
  #controls .row { display: flex; gap: 4px; flex-wrap: wrap; }
  button { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line);
    border-radius: 6px; padding: 2px 8px; cursor: pointer; }
  button:hover, button:focus-visible { border-color: var(--ink); outline: none; }
  button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  #footer { left: 10px; right: 10px; bottom: 10px; color: var(--muted); font-size: 11.5px; }
  #footer .warn { color: var(--amber); font-weight: 600; }
  #legend { right: 10px; top: 158px; display: none; font-size: 11.5px; }
  #legend .bar { height: 8px; width: 140px; border-radius: 4px;
    background: linear-gradient(90deg, #e3e8f2, #14181f); margin: 4px 0; }
  .tag { position: absolute; transform: translate(-50%, -50%); font-size: 11.5px; font-weight: 600;
    padding: 1px 5px; border-radius: 4px; background: var(--panel); border: 1px solid var(--line);
    pointer-events: none; white-space: nowrap; }
  .tag.cg { color: var(--cg); } .tag.cp { color: var(--cp); } .tag.assumed { color: var(--amber); }
  .tag.part { color: var(--muted); font-weight: 500; }
  #message { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted);
    text-align: center; padding: 24px; }
  .stage { position: absolute; inset: 0; }
  .muted { color: var(--muted); } .small { font-size: 11px; }
  /* versions mode: 3D on the left, details on the right, timeline along the bottom */
  #app.versions .stage { right: 330px; bottom: 78px; }
  #side { right: 10px; top: 10px; bottom: 88px; width: 300px; overflow: auto; display: flex;
    flex-direction: column; gap: 6px; }
  #side .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  #side label { display: flex; gap: 4px; align-items: center; cursor: pointer; }
  #side table { border-collapse: collapse; width: 100%; table-layout: fixed; font-size: 12px;
    font-variant-numeric: tabular-nums; }
  #side th, #side td { padding: 2px 4px; text-align: right; border-bottom: 1px solid var(--line);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #side th:first-child, #side td:first-child { text-align: left; }
  #side ul { margin: 2px 0 0; padding-left: 16px; font-size: 11.5px; }
  .state { font-weight: 700; } .state.pass { color: var(--pass); } .state.fail { color: var(--cp); }
  .warnline { color: var(--amber); font-size: 11.5px; } .hl { color: var(--changed); font-weight: 600; }
  .judge .state { font-size: 11.5px; }
  #timeline { left: 10px; right: 10px; bottom: 10px; padding: 6px 10px; }
  #timeline input[type=range] { width: 100%; margin: 0; accent-color: var(--changed); }
  .ticks { display: flex; gap: 2px; }
  .ticks .tick { flex: 1 1 0; min-width: 0; border: 0; padding: 1px 2px; font-size: 11px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
  .ticks .tick.on { color: var(--ink); font-weight: 700; } .ticks .tick.was { text-decoration: underline; }
  .tick .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 4px;
    background: var(--pass); } .tick.fail .dot { background: var(--cp); }
  #extra { left: 10px; right: 10px; display: none; }
  /* flight mode: the picture, then a player bar that always stays inside the frame */
  #app.flight { display: flex; flex-direction: column; }
  #app.flight .stage { position: relative; inset: auto; flex: 1 1 auto; min-height: 0; overflow: hidden; }
  .fhud { position: absolute; left: 10px; top: 10px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 5px 10px; font-variant-numeric: tabular-nums; }
  .fhud-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .fhud .k { color: var(--muted); font-size: 12px; }
  .fhud .v { font-weight: 700; font-size: 15px; min-width: 5.6em; text-align: right; }
  .fhud .v.super { color: var(--changed); }
  .caption { position: absolute; left: 176px; right: 10px; top: 12px; text-align: center; pointer-events: none; }
  .caption-main { display: inline-block; font-size: 24px; font-weight: 800; padding: 2px 14px; border-radius: 8px;
    background: var(--panel); border: 1px solid var(--line); white-space: nowrap; }
  .caption.super .caption-main { color: #fff; background: var(--changed); border-color: var(--changed); }
  .caption-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .caption-sub:empty { display: none; }
  .caption.flash .caption-main { animation: machflash 0.9s ease-out 1; }
  @keyframes machflash {
    0% { transform: scale(1.3); box-shadow: 0 0 0 12px var(--changed); }
    100% { transform: scale(1); box-shadow: 0 0 0 0 transparent; }
  }
  @media (prefers-reduced-motion: reduce) { .caption.flash .caption-main { animation: none; } }
  .fcam { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .fcam-note { position: absolute; left: 176px; right: 10px; bottom: 26px; text-align: center; font-size: 11px;
    color: var(--muted); }
  select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
    padding: 2px 4px; }
  .notfootage { position: absolute; right: 8px; bottom: 6px; font-size: 11px; color: var(--muted);
    background: var(--panel); padding: 1px 6px; border-radius: 4px; max-width: calc(100% - 16px);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player { flex: 0 0 auto; display: flex; flex-direction: column; gap: 2px; padding: 2px 14px 8px;
    border-top: 1px solid var(--line); background: var(--bg); }
  .prow { display: flex; align-items: center; gap: 10px; }
  .prow .spacer { flex: 1 1 auto; }
  .playbtn { width: 44px; height: 44px; flex: 0 0 auto; border-radius: 50%; border: 0; padding: 0;
    background: var(--ink); color: var(--bg); display: grid; place-items: center; }
  .playbtn:hover, .playbtn:focus-visible { outline: 2px solid var(--changed); outline-offset: 2px; }
  .fclock { font-variant-numeric: tabular-nums; font-size: 14px; white-space: nowrap; }
  .tl { position: relative; height: 50px; cursor: pointer; outline: none; }
  .tl:focus-visible .rail { outline: 2px solid var(--changed); outline-offset: 3px; }
  .tl .leads { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  .tl .leads line { stroke: var(--muted); stroke-width: 1; }
  .tl .leads line.mach { stroke: var(--changed); }
  .tl .rail { position: absolute; left: 0; right: 0; top: 38px; height: 6px; border-radius: 3px;
    background: var(--line); }
  .tl .done { width: 0; height: 100%; border-radius: 3px; background: var(--changed); }
  .tl .tick { position: absolute; top: 35px; width: 2px; height: 12px; margin-left: -1px; background: var(--ink);
    opacity: 0.55; }
  .tl .tick.mach { background: var(--changed); opacity: 1; }
  .tl .knob { position: absolute; top: 34px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%;
    background: var(--ink); border: 2px solid var(--bg); }
  .tl .ev { position: absolute; font-size: 11px; line-height: 14px; padding: 0 4px; border-radius: 4px;
    border: 1px solid var(--line); background: var(--panel); white-space: nowrap; }
  .tl .ev.mach { color: var(--changed); border-color: var(--changed); font-weight: 700; }
  .tag.event { color: var(--ink); font-weight: 500; }
  .tag.rocket { color: var(--bg); background: var(--changed); border-color: var(--changed); }
  /* fallback: the tool's numbers and side view, flowing */
  #app.fallback { height: auto; overflow: visible; }
  #fallback { padding: 12px; }
  #fallback img { display: block; max-width: 100%; height: auto; margin: 8px 0; border-radius: 6px; }
  #fallback h2 { font-size: 13px; margin: 10px 0 4px; }
  #fallback table { border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
  #fallback th, #fallback td { text-align: left; padding: 2px 8px 2px 0; border-bottom: 1px solid var(--line);
    vertical-align: top; }
  #fallback pre { white-space: pre-wrap; font-size: 11.5px; }
</style>
</head>
<body>
<div id="app">
  <div id="message">Waiting for Ogive's data&hellip;</div>
</div>
<script>/*__THREE__*/</script>
<script>/*__APP__*/</script>
</body>
</html>
